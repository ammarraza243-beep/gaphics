<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
body{background:#ccc}
section{position:relative;overflow:hidden;margin-bottom:20px}
.word{font-family:Playfair;font-weight:800;color:var(--char);letter-spacing:-.5px;line-height:1}
.word em{font-style:italic;font-weight:700;color:var(--sage2)}
</style></head><body>

<!-- reusable mark -->
<svg width="0" height="0" style="position:absolute"><defs>
 <symbol id="mark" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="96" fill="#FAF7F0"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#6B705C" stroke-width="5"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="#A3B18A" stroke-width="1.5" stroke-dasharray="3 5"/>
  <!-- rising bars -->
  <rect x="55" y="118" width="20" height="34" rx="4" fill="#D6C7A9"/>
  <rect x="82" y="100" width="20" height="52" rx="4" fill="#A3B18A"/>
  <rect x="109" y="80" width="20" height="72" rx="4" fill="#7F9468"/>
  <line x1="48" y1="152" x2="152" y2="152" stroke="#36393B" stroke-width="4" stroke-linecap="round"/>
  <!-- sprout from tallest bar -->
  <path d="M119 80 C 119 66, 124 58, 132 50" stroke="#6B705C" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M131 51 C 136 36, 152 30, 162 33 C 160 46, 146 56, 131 51 Z" fill="#7F9468"/>
  <path d="M124 62 C 112 52, 100 54, 94 60 C 102 70, 116 70, 124 62 Z" fill="#A3B18A"/>
 </symbol></defs></svg>

<!-- 1 SHOP ICON 500x500 -->
<section id="logo" style="width:500px;height:500px;background:var(--cream)">
  <svg class="abs" style="left:110px;top:44px" width="280" height="280"><use href="#mark"/></svg>
  <div class="abs center word" style="top:344px;font-size:58px">Better<em>Life</em></div>
  <div class="abs center kicker" style="top:416px;font-size:21px;letter-spacing:.55em;color:var(--olive);padding-left:.55em">TOOL</div>
</section>

<!-- 2 MARK ONLY (transparent) 500x500 -->
<section id="markonly" style="width:500px;height:500px;background:transparent">
  <svg class="abs" style="left:10px;top:10px" width="480" height="480"><use href="#mark"/></svg>
</section>

<!-- 3 HORIZONTAL WORDMARK (transparent) 1200x360 -->
<section id="wordmark" style="width:1200px;height:360px;background:transparent">
  <svg class="abs" style="left:40px;top:40px" width="280" height="280"><use href="#mark"/></svg>
  <div class="abs word" style="left:360px;top:88px;font-size:124px">Better<em>Life</em></div>
  <div class="abs kicker" style="left:366px;top:236px;font-size:32px;letter-spacing:.5em;display:flex;align-items:center;gap:22px">TOOL <span style="width:300px;height:2px;background:var(--sage)"></span></div>
</section>

<!-- 4 BIG BANNER 3360x840 (Etsy recommended) -->
<section id="banner" style="width:3360px;height:840px;background:var(--cream)">
  <div class="blob" style="width:1500px;height:1500px;left:1900px;top:-300px;background:radial-gradient(circle,#EEF2E8 0,#EEF2E8 45%,rgba(238,242,232,0) 68%)"></div>
  <div class="blob" style="width:900px;height:900px;left:-250px;top:200px;background:radial-gradient(circle,#F3EDE2 0,#F3EDE2 45%,rgba(243,237,226,0) 68%)"></div>
  <svg class="sprig" data-sprig="-40,900,-55,620,16" style="left:0;top:0"></svg>
  <svg class="sprig" data-sprig="3420,-40,130,560,15" style="left:0;top:0"></svg>
  <!-- centre text block (mobile-safe middle) -->
  <svg class="abs" style="left:820px;top:200px" width="440" height="440"><use href="#mark"/></svg>
  <div class="abs word" style="left:1320px;top:210px;font-size:170px">Better<em>Life</em> Tool</div>
  <div class="abs script" style="left:1330px;top:400px;font-size:96px">plan ahead &amp; save calmly</div>
  <div class="abs" style="left:1330px;top:540px;display:flex;gap:22px">
    <span class="pill" style="font-size:34px;padding:16px 30px"><i style="width:34px;height:34px;font-size:20px">✓</i>Google Sheets</span>
    <span class="pill" style="font-size:34px;padding:16px 30px"><i style="width:34px;height:34px;font-size:20px">✓</i>Excel</span>
    <span class="pill" style="font-size:34px;padding:16px 30px"><i style="width:34px;height:34px;font-size:20px">✓</i>Instant download</span>
  </div>
  <!-- product on the right -->
  <div class="laptop" style="left:2520px;top:150px;width:760px">
    <div class="lid"><div class="scr" style="height:475px"><img src="shots/dash_top.png"></div></div><div class="base"></div></div>
  
</section>

<!-- 5 MINI BANNER 1200x213 (Etsy 'mini' / mobile-friendly) -->
<section id="mini" style="width:1200px;height:213px;background:var(--cream)">
  <svg class="sprig" data-sprig="-20,240,-40,200,9" style="left:0;top:0"></svg>
  <svg class="sprig" data-sprig="1220,-20,140,200,9" style="left:0;top:0"></svg>
  <svg class="abs" style="left:250px;top:26px" width="160" height="160"><use href="#mark"/></svg>
  <div class="abs word" style="left:440px;top:46px;font-size:64px">Better<em>Life</em> Tool</div>
  <div class="abs script" style="left:446px;top:118px;font-size:44px">smart spreadsheets for a calmer life</div>
</section>

<script>
document.querySelectorAll('[data-sprig]').forEach(svg=>{const [x,y,ang,len,n]=svg.dataset.sprig.split(',').map(Number);
 const ns='http://www.w3.org/2000/svg';const sec=svg.closest('section');svg.setAttribute('width',sec.clientWidth);svg.setAttribute('height',sec.clientHeight);svg.style.overflow='visible';
 const sc=len/330;const a=ang*Math.PI/180;const ex=x+Math.cos(a)*len,ey=y+Math.sin(a)*len;const mx=x+Math.cos(a)*len/2+Math.sin(a)*30*sc,my=y+Math.sin(a)*len/2-Math.cos(a)*30*sc;
 const p=document.createElementNS(ns,'path');p.setAttribute('d',`M${x} ${y} Q${mx} ${my} ${ex} ${ey}`);p.setAttribute('stroke','#8C8A6E');p.setAttribute('stroke-width',4*sc);p.setAttribute('fill','none');svg.appendChild(p);
 const L=p.getTotalLength();const cols=['#A3B18A','#9AAA86','#B7C4A3','#8FA07A','#C2CDB1'];
 for(let i=1;i<=n;i++){const t=i/(n+1)*L;const pt=p.getPointAtLength(t);const pt2=p.getPointAtLength(Math.min(L,t+1));const da=Math.atan2(pt2.y-pt.y,pt2.x-pt.x)*180/Math.PI;
  for(const s of [-1,1]){const r=(26-i*0.9)*sc;const e=document.createElementNS(ns,'ellipse');e.setAttribute('cx',0);e.setAttribute('cy',s*r*0.95);e.setAttribute('rx',r*0.85);e.setAttribute('ry',r);
   e.setAttribute('fill',cols[(i+(s>0))%5]);e.setAttribute('opacity','.92');e.setAttribute('transform',`translate(${pt.x} ${pt.y}) rotate(${da+(s*12)})`);svg.appendChild(e);}}});
</script></body></html>
